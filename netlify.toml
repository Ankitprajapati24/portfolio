# Netlify build settings for portfolio.codebread.fun
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Voice recordings and images never change once published, so browsers can cache them.
[[headers]]
  for = "/voice/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Blog: post pages are pre-built at /blog/<slug>/; anything else under /blog falls back to the blog app.
[[redirects]]
  from = "/blog/*"
  to = "/blog/index.html"
  status = 200
